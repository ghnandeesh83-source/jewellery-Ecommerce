{% extends 'layout.html' %}

{% block content %}
<style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .top-bar {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: linear-gradient(135deg, #d4af37, #b8860b);
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .top-bar h1 { margin: 0; color: #0f1424; font-size: 1.5rem; }
    .info-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(15, 20, 36, 0.95);
        padding: 20px;
        border-radius: 16px;
        color: white;
        max-width: 300px;
        border: 1px solid #d4af37;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .info-panel h2 { margin: 0 0 10px 0; color: #d4af37; }
    .info-panel p { margin: 5px 0; font-size: 14px; }
    .btn-dir {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10;
        background: linear-gradient(135deg, #d4af37, #b8860b);
        color: #0f1424;
        padding: 15px 25px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        border: none;
        box-shadow: 0 4px 20px rgba(212,175,55,0.4);
    }
    .btn-dir:hover { transform: scale(1.05); }
    .distance-badge {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(15, 20, 36, 0.95);
        padding: 10px 20px;
        border-radius: 25px;
        color: #d4af37;
        font-weight: bold;
        display: none;
        border: 1px solid #d4af37;
    }
</style>

<div id="map"></div>

<div class="top-bar">
    <h1>💎 Shri Jewellery</h1>
</div>

<div class="distance-badge" id="distance-badge"></div>

<div class="info-panel">
    <h2>🏪 Shri Jewellery</h2>
    <p>📍 Chinya, Honakere</p>
    <p>📍 Nagamangala, Karnataka</p>
    <p>📍 571431</p>
    <p>📞 +91 6363650179</p>
    <p>📞 +91 89044 39579</p>
</div>

<button class="btn-dir" onclick="openDirections()">🚗 Get Directions</button>

<script>
    let map, userMarker, shopMarker;
    const shopLocation = { lat: 12.7716, lng: 76.5173 };

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            center: shopLocation,
            zoom: 16,
            styles: [
                { elementType: "geometry", stylers: [{ color: "#212121" }] },
                { elementType: "labels.text.stroke", stylers: [{ color: "#212121" }] },
                { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
                { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
            ]
        });

        shopMarker = new google.maps.Marker({
            position: shopLocation,
            map: map,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 20,
                fillColor: '#d4af37',
                fillOpacity: 1,
                strokeColor: '#fff',
                strokeWeight: 3
            },
            title: "Shri Jewellery"
        });

        const infoWindow = new google.maps.InfoWindow({
            content: '<div style="padding:10px;"><h3 style="color:#d4af37;">🏪 Shri Jewellery</h3><p>📍 Chinya, Honakere, Nagamangala</p><p>📞 +91 6363650179</p></div>'
        });

        shopMarker.addListener("click", () => infoWindow.open(map, shopMarker));

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                userMarker = new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                    title: "Your Location"
                });
                const distance = getDistance(userLocation, shopLocation);
                const badge = document.getElementById('distance-badge');
                badge.style.display = 'block';
                badge.innerHTML = '📍 Distance: ' + distance.toFixed(2) + ' km';
            });
        }
    }

    function getDistance(loc1, loc2) {
        const R = 6371;
        const dLat = (loc2.lat - loc1.lat) * Math.PI / 180;
        const dLng = (loc2.lng - loc1.lng) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(loc1.lat * Math.PI / 180) * Math.cos(loc2.lat * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openDirections() {
        window.open("https://www.google.com/maps/dir/?api=1&destination=12.7716,76.5173", "_blank");
    }

    window.initMap = initMap;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&callback=initMap"></script>
{% endblock %}
