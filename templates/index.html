{% extends 'layout.html' %}
{% block content %}
<section class="hero">
  <div class="hero-content">
    <h1>Fine Jewellery for Everyone</h1>
    <p>Gold, Silver, and Diamond pieces for Women, Men, and Children.</p>
  </div>
</section>

<!-- Premium hero slider for rings & chains -->
<section class="hero-slider">
  <div class="hero-slider-track"></div>
</section>

<section class="filters">
  <div class="filter">
    <label>Audience</label>
    <select id="filter-audience">
      <option value="all" selected>All</option>
      <option value="women">Women</option>
      <option value="men">Men</option>
      <option value="children">Children</option>
    </select>
  </div>
  <div class="filter">
    <label>Type</label>
    <select id="filter-type">
      <option value="all" selected>All</option>
      <option value="ring">Ring</option>
      <option value="chain">Chain</option>
      <option value="nosepin">Nose Pin</option>
      <option value="necklace">Necklace</option>
    </select>
  </div>
  <div class="filter">
    <label>Metal</label>
    <select id="filter-metal">
      <option value="all" selected>All</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="diamond">Diamond</option>
    </select>
  </div>
</section>

<section id="products" class="grid"></section>

<!-- Cart Drawer -->
<aside id="cart" class="cart">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button id="close-cart" class="icon-btn">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-footer">
    <div class="total"><span>Total:</span> <strong id="cart-total">₹0</strong></div>
    <div id="voucher-section" style="margin-bottom: 10px;">
      <div style="display:flex;gap:8px;">
        <input id="voucher-code" name="voucher_code" placeholder="Gift Voucher Code" style="flex:1;padding:10px;background:#0c1220;border:1px solid #283257;color:var(--text);border-radius:8px;" />
        <button type="button" id="apply-voucher" class="btn" style="padding:10px 15px;">Apply</button>
      </div>
      <div id="voucher-result" style="margin-top:8px;font-size:13px;"></div>
      <div id="voucher-discount" style="color:#4caf50;font-weight:bold;margin-top:5px;display:none;">
        Discount Applied: <span id="discount-amount">₹0</span>
      </div>
    </div>
    <div class="total" id="final-total-section" style="display:none;">
      <span>Final Total:</span> <strong id="final-total" style="color:#4caf50;">₹0</strong>
    </div>
    <form id="checkout-form" class="checkout-form">
      <input required name="name" placeholder="Full name" />
      <input required name="email" type="email" placeholder="Email" />
      <input required name="phone" placeholder="Phone" />
      <textarea required name="address" placeholder="Delivery Address" rows="2" style="width:100%;padding:10px;background:#0c1220;border:1px solid #283257;color:var(--text);border-radius:8px;margin:6px 0;resize:none;"></textarea>
      <button type="submit" class="btn primary">Place Order</button>
      <div id="order-confirm-inline" class="order-message" hidden>Order is Confirmed</div>
    </form>
  </div>
</aside>

<div id="toast" class="toast" hidden></div>
{% endblock %}
