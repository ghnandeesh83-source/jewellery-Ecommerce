{% extends 'layout.html' %}
{% block content %}
<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to continue to Shri Jewellery</p>
    </div>
    <form id="login-form">
      <div id="phone-step">
        <div class="input-group">
          <label for="phone">Phone Number</label>
          <div class="phone-input">
            <span class="country-code">+91</span>
            <input type="tel" id="phone" name="phone" placeholder="98765 43210" required>
          </div>
        </div>
        <button type="button" id="send-otp-btn" class="btn primary full-width">Send OTP</button>
      </div>
      <div id="otp-display" style="display: none; background: #e8f5e9; border: 2px solid #4caf50; border-radius: 8px; padding: 15px; margin: 15px 0; text-align: center;">
        <p style="color: #2e7d32; font-size: 12px; margin-bottom: 8px;">Your OTP is:</p>
        <p id="otp-code" style="font-size: 28px; font-weight: bold; color: #1b5e20; letter-spacing: 8px; margin: 0;"></p>
        <p style="color: #666; font-size: 11px; margin-top: 8px;">(For demo - OTP shown on screen)</p>
      </div>
      <div id="otp-step" style="display: none;">
        <div class="input-group">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" name="otp" placeholder="_ _ _ _ _ _" required maxlength="6">
        </div>
        <button type="submit" class="btn primary full-width">Verify & Login</button>
        <button type="button" id="back-btn" class="btn secondary full-width">Back</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
