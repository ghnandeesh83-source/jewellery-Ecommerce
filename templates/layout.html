<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shri Jewellery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Shri Jewellery</a>
        <nav class="nav">
          <a href="/gift-voucher" class="btn voucher-btn">🎁 Gift Voucher</a>
          <a href="/location" class="btn secondary">📍 Location</a>
          <a href="/try-on" class="btn secondary">Try On</a>
          {% if user %}
            <span class="user-info">Welcome, {{ user.phone }}</span>
            <a href="/vouchers" class="btn secondary">My Vouchers</a>
            <a href="/logout" class="btn secondary">Logout</a>
          {% else %}
            <a href="/login" class="btn primary">Login</a>
          {% endif %}
          <button id="open-cart" class="btn">Cart</button>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <strong>Address:</strong>
          <div>Chinya, Nagamangala Taluk, Mandya District, Mysore Main Road</div>
        </div>
        <div>
          <strong>Phone:</strong>
          <div>+91 6363650179 / +91 89044 39579</div>
        </div>
        <div style="margin-top:15px;">
          <a href="/admin" style="color:#888;font-size:0.8rem;text-decoration:none;">Admin Panel</a>
        </div>
      </div>
    </footer>

    <script src="/static/js/main.js" defer></script>
    <script src="/static/js/login.js" defer></script>
    <!-- Chatbot disabled -->
  </body>
</html>
